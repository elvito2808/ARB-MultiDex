name: Python offline checks
on:
  push:
    branches: [mvp-python]
  pull_request:
    branches: [mvp-python]
  workflow_dispatch:

jobs:
  offline-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out exact commit
        uses: actions/checkout@v4
      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test-only dependencies
        run: |
          python -m pip install --disable-pip-version-check \
            'pytest==9.2.0' 'PyYAML==6.0.3' 'websockets==16.0' 'ruff==0.17.6'
      - name: Ruff lint
        run: python -m ruff check src tests --target-version py310 --line-length 100
      - name: Offline unit tests
        env:
          PYTHONPATH: src
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
          PYTHONDONTWRITEBYTECODE: '1'
        run: python -m pytest -q -p no:cacheprovider
